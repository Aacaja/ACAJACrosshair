[[bin]]
name = "acaja"
path = "src/bin/backend.rs"

[[bin]]
name = "acaja-ui"
path = "src/bin/ui.rs"
required-features = ["gpui-ui"]

[package]
name = "acaja"
version = "1.3.0"
edition = "2021"
description = "ACAJA - Windows crosshair overlay tool"
authors = ["Aacaja"]
license = "MIT"
repository = "https://github.com/liuroland55/CrossHairLIN"
build = "build.rs"

[features]
# 默认不拉 GPUI：后端/旧设置界面构建保持轻量；
# 预览构建显式 `--features gpui-ui`，后续重构完成后再考虑默认启用。
default = []
gpui-ui = ["dep:gpui-kit"]

[dependencies]
# Windows API (Win32) —— 特性按命名空间裁剪，只编译用到的部分
windows = { version = "0.58", features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]}

# 数据与序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 并发与事件
crossbeam-channel = "0.5"
# 锁：无中毒语义（parking_lot 的 lock()/read()/write() 直接返回 guard，没有 PoisonError）
parking_lot = "0.12"

# 自定义图片准星解码
image = "0.25"

# 日志
log = "0.4"
simplelog = "0.12"

# 原生文件对话框（自定义图片选择、预设导入/导出）
rfd = "0.17"

# 设置界面（v1.3 起）：GPUI Kit 固定精确版本——
# 它 pin 了对应的 gpui-pre 快照，0.x 期间 API 会变；升级必须显式改版本并跑 CI。
gpui-kit = { version = "=0.8.0", optional = true }

[build-dependencies]
winres = "0.1"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.dev]
debug = 1
